name: Update Monthly Raw Material Data

on:
  workflow_dispatch: # 웹에서 'Run workflow' 버튼을 활성화하는 트리거
  schedule:
    - cron: '0 0 1 * *' # 매월 1일 오전 9시(KST) 정기 자동 실행

jobs:
  run-monthly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests beautifulsoup4 gspread oauth2client

      - name: Run Monthly Backfill Script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python backfill_monthly.py
