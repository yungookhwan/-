name: Update Monthly Raw Material Data

on:
  workflow_dispatch: # 웹에서 'Run workflow' 버튼을 활성화하는 트리거
  schedule:
    - cron: '0 0 1 * *' # 매월 1일 오전 9시(KST) 정기 자동 실행

jobs:
  run-monthly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # requirements.txt에 등록된 모든 패키지를 확실하게 설치하도록 변경
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pandas

      - name: Run Monthly Backfill Script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # Gemini API 키 추가
        run: python backfill_monthly.py
