name: 원자재 월간 시황 자동 집계 파이프라인

on:
  schedule:
    # 매월 1일 한국 시간(KST) 오전 09:00 자동 실행 (UTC 00:00)
    - cron: '0 0 1 * *'
  # 언제든 수동으로 즉시 실행할 수 있는 버튼 활성화
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 리포지토리 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. Python 3.10 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 월간 원자재 시황 집계 및 구글 시트 적재 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: |
         python backfill_monthly.py
