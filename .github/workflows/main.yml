name: Commodity Data Collector

on:
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 활성화
  schedule:
    # 매일 평일(월~금) 한국 시간 오전 10시 45분 실행 (KOMIS 메일 수신 후 반영)
    - cron: '45 1 * * 1-5'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pandas

      - name: 파이프라인 실행
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}            # ★ 메일 파싱 계정
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}    # ★ 16자리 앱 비밀번호
        run: python main.py
